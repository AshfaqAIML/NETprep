# =============================================================================
# NETPrep Hub — docker-compose.yml
# =============================================================================
# One-command local stack: app + PostgreSQL (optional).
#
#   docker compose up              # app on http://localhost:3000
#   docker compose up -d           # detached
#   docker compose down            # stop
#   docker compose down -v         # stop + delete volumes
#
# Switch DATABASE_URL in .env to use PostgreSQL instead of SQLite.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # NETPrep Hub application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netprep-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-file:/app/data/custom.db}
      - AUTH_SECRET=${AUTH_SECRET:-change-me-to-a-long-random-string}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - STORAGE_LOCAL_PATH=/app/public/uploads
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-none}
      - AI_PROVIDER=${AI_PROVIDER:-none}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-postgres}
    volumes:
      # Persist SQLite database and local uploads
      - app-data:/app/data
      - app-uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # PostgreSQL (optional — comment out to use SQLite)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: netprep-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netprep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netprep}
      POSTGRES_DB: ${POSTGRES_DB:-netprep}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netprep} -d ${POSTGRES_DB:-netprep}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-data:
  app-uploads:
  db-data:
